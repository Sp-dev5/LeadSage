[server]
enableStaticServing = true

[client]
toolbarMode = "minimal"

[[theme.fontFaces]]
family = "Geist"
url = "app/static/fonts/geist-latin-wght-normal.woff2"
weight = "100 900"

[theme]
font = "Geist"
headingFont = "Geist"
baseFontSize = 15
headingFontWeights = [600, 600, 600, 500, 500, 500]
headingFontSizes = ["30px", "22px", "18px", "16px", "14px", "12px"]
baseRadius = "10px"
buttonRadius = "8px"
metricValueFontSize = "2.1rem"
metricValueFontWeight = 600
showSidebarBorder = true
linkUnderline = false
greenColor = "#0B7A55"
orangeColor = "#A16207"
redColor = "#C2410C"
grayColor = "#6B7177"
blueColor = "#3D6F8E"
violetColor = "#6B7177"

[theme.light]
primaryColor = "#047857"
backgroundColor = "#FAFAF9"
secondaryBackgroundColor = "#F1F2F0"
textColor = "#111314"
linkColor = "#047857"
borderColor = "#E3E5E2"
dataframeBorderColor = "#E3E5E2"
dataframeHeaderBackgroundColor = "#F1F2F0"
chartCategoricalColors = ["#047857", "#A16207", "#6B7177", "#3D6F8E", "#C2410C"]

[theme.dark]
primaryColor = "#047857"
backgroundColor = "#0C0E0F"
secondaryBackgroundColor = "#15181A"
textColor = "#ECEDEE"
linkColor = "#34D399"
borderColor = "#23272A"
dataframeBorderColor = "#23272A"
dataframeHeaderBackgroundColor = "#121517"
chartCategoricalColors = ["#34D399", "#F5B544", "#8A9096", "#7FB3D5", "#F0835A"]

[theme.dark.sidebar]
backgroundColor = "#0A0C0D"
secondaryBackgroundColor = "#15181A"
borderColor = "#1C2023"

[theme.light.sidebar]
backgroundColor = "#F4F5F3"
secondaryBackgroundColor = "#E9EBE8"
borderColor = "#E3E5E2"
