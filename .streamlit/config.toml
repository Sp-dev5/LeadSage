[server]
enableStaticServing = true

[client]
toolbarMode = "minimal"

[[theme.fontFaces]]
family = "Geist"
url = "app/static/fonts/geist-latin-wght-normal.woff2"
weight = "100 900"

[theme]
base = "dark"
font = "Geist"
headingFont = "Geist"
baseFontSize = 15
headingFontWeights = [500, 500, 600, 500, 500, 500]
headingFontSizes = ["52px", "28px", "18px", "16px", "14px", "12px"]
baseRadius = "16px"
buttonRadius = "full"
metricValueFontSize = "2.4rem"
metricValueFontWeight = 600
showSidebarBorder = true
showWidgetBorder = true
linkUnderline = false

primaryColor = "#A8D5BA"
backgroundColor = "#0F1110"
secondaryBackgroundColor = "#161917"
textColor = "#ECEEEB"
linkColor = "#A8D5BA"
borderColor = "#3B3E3C"
dataframeBorderColor = "#2A2D2B"
dataframeHeaderBackgroundColor = "#0B0C0C"
chartCategoricalColors = ["#A8D5BA", "#F07A3C", "#A7ADA8", "#ECEEEB", "#767D78"]

greenColor = "#A8D5BA"
greenTextColor = "#A8D5BA"
greenBackgroundColor = "#1C2A22"
orangeColor = "#F07A3C"
orangeTextColor = "#F49A68"
orangeBackgroundColor = "#2E1C12"
redColor = "#E8665A"
redTextColor = "#F08A80"
redBackgroundColor = "#2A1512"
grayColor = "#767D78"
grayTextColor = "#A7ADA8"
grayBackgroundColor = "#1A1D1B"
blueColor = "#A7ADA8"
violetColor = "#767D78"

[theme.sidebar]
backgroundColor = "#0B0C0C"
secondaryBackgroundColor = "#131514"
borderColor = "#2A2D2B"
