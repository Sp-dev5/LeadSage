[server]
enableStaticServing = true

[client]
toolbarMode = "minimal"

[[theme.fontFaces]]
family = "Geist"
url = "app/static/fonts/geist-latin-wght-normal.woff2"
weight = "100 900"

[theme]
base = "dark"
font = "Geist"
headingFont = "Geist"
baseFontSize = 15
headingFontWeights = [500, 500, 600, 500, 500, 500]
headingFontSizes = ["52px", "28px", "18px", "16px", "14px", "12px"]
baseRadius = "16px"
buttonRadius = "full"
metricValueFontSize = "2.4rem"
metricValueFontWeight = 600
showSidebarBorder = true
showWidgetBorder = true
linkUnderline = false

primaryColor = "#9AF0DF"
backgroundColor = "#000000"
secondaryBackgroundColor = "#0A1210"
textColor = "#EAF4F1"
linkColor = "#B5F7EA"
borderColor = "#1B2A27"
dataframeBorderColor = "#16231F"
dataframeHeaderBackgroundColor = "#07100D"
chartCategoricalColors = ["#9AF0DF", "#E9C47A", "#8C9A96", "#9CC7E8", "#F0A090"]

greenColor = "#9AF0DF"
greenTextColor = "#B5F7EA"
greenBackgroundColor = "#12302A"
orangeColor = "#E9C47A"
orangeTextColor = "#F2CD86"
orangeBackgroundColor = "#2B2212"
redColor = "#F07A6A"
redTextColor = "#F59B8E"
redBackgroundColor = "#2A1310"
grayColor = "#8A9893"
grayTextColor = "#B4C1BC"
grayBackgroundColor = "#151C1A"
blueColor = "#7FB3D5"
violetColor = "#8A9893"

[theme.sidebar]
backgroundColor = "#030706"
secondaryBackgroundColor = "#0A1210"
borderColor = "#14201C"
