[server]
enableStaticServing = true

[client]
toolbarMode = "minimal"

[[theme.fontFaces]]
family = "Geist"
url = "app/static/fonts/geist-latin-wght-normal.woff2"
weight = "100 900"

[theme]
base = "dark"
font = "Geist"
headingFont = "Geist"
baseFontSize = 15
headingFontWeights = [600, 600, 600, 500, 500, 500]
headingFontSizes = ["40px", "24px", "18px", "16px", "14px", "12px"]
baseRadius = "12px"
buttonRadius = "10px"
metricValueFontSize = "2.4rem"
metricValueFontWeight = 600
showSidebarBorder = true
showWidgetBorder = true
linkUnderline = false

primaryColor = "#5BE9C6"
backgroundColor = "#000000"
secondaryBackgroundColor = "#0A1210"
textColor = "#E6F0EC"
linkColor = "#7CF5D6"
borderColor = "#1A2823"
dataframeBorderColor = "#16231F"
dataframeHeaderBackgroundColor = "#07100D"
chartCategoricalColors = ["#5BE9C6", "#F2B44C", "#8A9893", "#7FB3D5", "#F07A6A"]

greenColor = "#5BE9C6"
greenTextColor = "#7CF5D6"
greenBackgroundColor = "#0D2620"
orangeColor = "#F2B44C"
orangeTextColor = "#F5C46B"
orangeBackgroundColor = "#291E0B"
redColor = "#F07A6A"
redTextColor = "#F59B8E"
redBackgroundColor = "#2A1310"
grayColor = "#8A9893"
grayTextColor = "#A9B5B0"
grayBackgroundColor = "#121A17"
blueColor = "#7FB3D5"
violetColor = "#8A9893"

[theme.sidebar]
backgroundColor = "#030706"
secondaryBackgroundColor = "#0A1210"
borderColor = "#14201C"
